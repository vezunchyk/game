# Покласти в репозиторій як .github/workflows/unpack.yml
# Робить: коли в корінь репозиторію залито stalker-mmo.zip, GitHub сам
# розпаковує його у файли проєкту, видаляє архів і робить коміт.
# Твоя карта (map-src/map.json) НЕ перезаписується архівом: після розпаковки вона заново
# збирається НОВИМ кодом, тож код з архіву й остання карта з редактора завжди разом.
name: Розпакувати архів
on:
  push:
    paths: ["stalker-mmo.zip"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Розпакувати і замінити файли
        run: |
          mkdir /tmp/x && unzip -q stalker-mmo.zip -d /tmp/x
          [ -f map-src/map.json ] && cp map-src/map.json /tmp/map-keep.json || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/stalker-mmo/. ./
          [ -f /tmp/map-keep.json ] && cp /tmp/map-keep.json map-src/map.json || true
      - name: Зібрати карту новим кодом
        run: |
          node scripts/build-map.mjs map-src/map.json 2>&1 | tee map-report.txt || echo "Карту не зібрано — лишилась та, що в архіві (див. map-report.txt)"
      - name: Зберегти
        run: |
          git config user.name "zip-unpack"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Оновлення з архіву" || echo "Змін немає"
          git push
