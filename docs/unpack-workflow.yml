# ОДИН РАЗ створи в репозиторії файл .github/workflows/unpack.yml з цього вмісту
# (github.com: Add file -> Create new file, в назві пиши .github/workflows/unpack.yml).
#
# Далі: заливаєш у корінь репозиторію stalker-mmo.zip (Add file -> Upload files).
# GitHub сам розпакує його у файли проєкту, видалить архів і зробить коміт.
# Сервер сам підхопить новий коміт (scripts/server-pull.sh).
name: Розпакувати архів
on:
  push:
    paths: ["stalker-mmo.zip"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Розпакувати і замінити файли
        run: |
          mkdir /tmp/x && unzip -q stalker-mmo.zip -d /tmp/x
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/stalker-mmo/. ./
      - name: Зберегти
        run: |
          git config user.name "zip-unpack"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Оновлення з архіву" || echo "Змін немає"
          git push
