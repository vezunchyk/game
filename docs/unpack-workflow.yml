# Покласти в репозиторій як .github/workflows/unpack.yml
# Робить: коли в корінь репозиторію залито stalker-mmo.zip, GitHub сам
# розпаковує його у файли проєкту, видаляє архів і робить коміт.
name: Розпакувати архів
on:
  push:
    paths: ["stalker-mmo.zip"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Розпакувати і замінити файли
        run: |
          mkdir /tmp/x && unzip -q stalker-mmo.zip -d /tmp/x
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/stalker-mmo/. ./
      - name: Зберегти
        run: |
          git config user.name "zip-unpack"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Оновлення з архіву" || echo "Змін немає"
          git push
