<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Зона</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0a; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

  /* Екран входу */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0d0a; }
  #login form { display: flex; flex-direction: column; gap: 12px; width: min(300px, 80vw); }
  #login h1 { margin: 0 0 4px; color: #b8c79a; font-size: 24px; text-align: center; letter-spacing: 2px; }
  #login input, #login button { font-size: 18px; padding: 12px; border-radius: 6px; border: 1px solid #5a6446; }
  #login input { background: #161a12; color: #e8e8e8; }
  #login button { background: #5a6446; color: #fff; }
  #login-status { color: #d98c8c; min-height: 1.2em; text-align: center; font-size: 14px; }

  /* Джойстик: ліва половина екрана ловить дотик, "плаваючий" */
  #joy-zone { display: none; position: fixed; left: 0; bottom: 0; width: 55vw; height: 60vh; touch-action: none; }
  .joy-base { position: absolute; left: 90px; bottom: 90px; width: 112px; height: 112px; margin: -56px 0 0 -56px;
    border-radius: 50%; border: 2px solid rgba(184,199,154,.6); background: rgba(90,100,70,.25); opacity: .35; pointer-events: none; }
  .joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(184,199,154,.75); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="joy-zone">
  <div class="joy-base"><div class="joy-knob"></div></div>
</div>

<div id="login">
  <form id="login-form" autocomplete="off">
    <h1>ЗОНА</h1>
    <input id="nick" placeholder="Ваш нік" maxlength="16" required>
    <button type="submit">Увійти</button>
    <div id="login-status"></div>
  </form>
</div>

<script src="/game.js"></script>
</body>
</html>
